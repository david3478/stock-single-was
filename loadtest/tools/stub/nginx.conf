# 보정용 고정 응답 서버(ADR 0012, plan-stage10.md 7절). 앱·DB 없이 Nginx가 바로 응답한다.
# 본 측정과 같은 주소·같은 모양의 요청을 받아 부하 생성기(k6) 자체의 한계를 잰다.
# SSE 구독만 가짜 SSE 서버(StubSse.java, 8091)로 넘긴다. 측정 시간에만 띄우고 운영 설정에는 넣지 않는다.
worker_processes auto;
events {
    worker_connections 16384;
}
http {
    access_log off;
    server {
        listen 8090 backlog=4096;
        default_type application/json;

        # 주문(POST)과 주문 내역(GET)이 같은 경로라 메서드로 나눈다
        location ~ ^/api/accounts/[0-9]+/orders$ {
            if ($request_method = POST) {
                return 202 '{"orderId":1}';
            }
            return 200 '[{"orderId":1,"symbolCode":"SYM01","side":"BUY","limitPrice":1100,"quantity":1,"remaining":0,"status":"FILLED","createdAt":"2026-01-01T00:00:00Z"}]';
        }
        location ~ ^/api/accounts/[0-9]+/balance$ {
            return 200 '{"availableCash":100000000,"reservedCash":0}';
        }
        location ~ ^/api/accounts/[0-9]+/holdings$ {
            return 200 '[{"symbolCode":"SYM01","quantity":1000,"reservedQuantity":0,"sellableQuantity":1000}]';
        }
        location ~ ^/api/symbols/[A-Z0-9]+/orderbook$ {
            return 200 '{"symbolCode":"SYM01","bids":[],"asks":[{"price":1000,"quantity":999999,"orderCount":999999}]}';
        }
        location ~ ^/api/accounts/[0-9]+/notifications$ {
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
