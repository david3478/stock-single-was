spring:
  application:
    name: stock-single-was
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 종목 워커 수 + HTTP 요청 여유분 이상 (ADR 0004)
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        # readiness에 주문 복구 완료를 포함한다(ADR 0013)
        enabled: true
      group:
        readiness:
          include: readinessState,engines
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[hikaricp.connections.acquire]": true

trading:
  matching:
    queue-capacity: ${MATCHING_QUEUE_CAPACITY:50000}
    drain-batch-size: 500
    poll-timeout: 100ms
    deadlock-max-retries: 3
    deadlock-retry-delay: 10ms
    auto-start: true
  recovery:
    # 기동 복구 때 대기 주문을 한 번에 읽는 건수(EA 복구설정.주문조회건수)
    restore-batch-size: 1000
    # 체결감시 주기. 상태 불일치는 두 주기 연속 관찰될 때 경고한다(ADR 0005, 0013)
    monitor-interval: 5s
  query:
    default-page-size: 20
    max-page-size: 100
    default-order-book-depth: 10
    max-order-book-depth: 50
  notification:
    # 송신 스레드와 대기열. 연결마다 대기 작업은 최대 1개라 대기열은 동시 연결 수 이상이면 거절이 없다
    sender-threads: ${SSE_SENDER_THREADS:4}
    sender-queue-capacity: ${SSE_SENDER_QUEUE_CAPACITY:10000}
    # 프록시(Nginx 기본 60초)가 조용한 연결을 끊기 전에 보낸다
    heartbeat-interval: 15s
    emitter-timeout: 30m
    reconnect-time: 3s
    replay-batch-size: 100
