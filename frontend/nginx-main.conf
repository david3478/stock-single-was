# Nginx 전체 설정(/etc/nginx/nginx.conf). nginx:1.27-alpine 기본 파일에서 연결 수 설정만 바꿨다. 사이트 설정은 nginx.conf(conf.d/default.conf).
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# 작업 프로세스 하나가 열 수 있는 파일 수. 연결 하나가 파일 핸들을 쓰므로 worker_connections 이상이어야 한다.
# 컨테이너 제한(compose의 ulimits nofile)이 이보다 크거나 같아야 적용된다.
worker_rlimit_nofile 16384;

events {
    # 기본 1024 → 8192(plan-stage10.md 7절). worker_connections는 작업 프로세스당 클라이언트 연결과 앱 쪽 연결을 합친 수다.
    # SSE 한 개는 브라우저 쪽 1 + 앱 쪽 1 = 2개를 계속 잡는다. m7i.large(작업 프로세스 2개) 기본값이면 전체 약 2,048이라
    # SSE 1,000개만으로 차고, 그 위에 k6 HTTP 연결과 요청마다 여는 앱 쪽 연결이 더해진다. 8192 × 2 = 16,384로 올린다.
    # 연결이 넘치면 Nginx 오류 로그에 "worker_connections are not enough"가 남는다.
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
