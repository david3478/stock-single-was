# 화면 파일 제공 + /api 를 앱 컨테이너로 전달(ADR 0011). 브라우저에는 주소가 하나라 CORS가 필요 없다.
server {
    listen 80;
    server_tokens off;

    # 앱 주소를 Docker 내부 DNS로 요청마다 다시 찾는다. 앱 컨테이너만 재배포해 IP가 바뀌어도 Nginx를 재시작하지 않는다.
    # proxy_pass에 변수를 쓰면 시작 시점이 아니라 요청 시점에 이름을 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    root /usr/share/nginx/html;
    index index.html;

    # 파일 이름에 버전이 없으므로 매번 ETag로 바뀌었는지 확인한다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE. 버퍼링을 켜면 Nginx가 응답을 버퍼에 담고 넘치면 임시 파일에 쓴다. 끝나지 않는 스트림이라 끄고 받는 즉시 넘긴다.
    # (Nginx 1.27 실측: 버퍼링을 켜도 알림 지연은 없었다. 지연 방지가 아니라 위 이유로 끈다.)
    # 기본 읽기 제한(60초)이면 조용한 연결을 끊는다. 앱은 15초마다 연결유지 신호를 보내지만 여유를 둔다.
    location ~ ^/api/accounts/[0-9]+/notifications$ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
