# EC2에서 Nginx(프론트)와 앱을 실행한다. DB는 RDS다(ADR 0011). 로컬 개발용 docker-compose.yml과 별개다.
# 같은 폴더에 .env를 두고 실행한다: docker compose up -d
# .env 예시는 .env.example. 실제 .env는 git에 올리지 않는다.
# 로컬에서 RDS 대신 MySQL 컨테이너로 확인할 때: docker compose -f compose.yml -f compose.local-db.yml up -d
name: stock-single-was-deploy

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://${DB_HOST:?DB_HOST is required}:3306/stock_single_was?rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-Xmx768m -Duser.timezone=UTC"
    # 외부 포트를 열지 않는다. Nginx만 내부 네트워크로 접속한다.
    healthcheck:
      # 이미지에 curl이 없어 bash의 /dev/tcp로 readiness를 확인한다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  front:
    image: ${FRONT_IMAGE:?FRONT_IMAGE is required}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
