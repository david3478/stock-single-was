# 로컬 검증 전용: RDS 대신 MySQL 컨테이너를 붙인다. EC2에서는 쓰지 않는다.
#   .env에 DB_HOST=mysql 과 MYSQL_ROOT_PASSWORD 를 넣고
#   docker compose -f compose.yml -f compose.local-db.yml up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stock_single_was
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required for local DB}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    depends_on:
      mysql:
        condition: service_healthy
